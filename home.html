<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ブログタイトル</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ブログの説明文をここに書きます。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id = "header"></div>

  <main class="container">

    <!-- 記事１ -->
    <article class="post">
      <h2 class="post-title">記事タイトル１</h2>
      <div class="post-meta">投稿日: 2026-10-13 ｜ カテゴリ: 日記</div>
      <div class="post-content">
        <p>ここに本文を書きます。段落ごとに&lt;p&gt;タグを使うと読みやすくなります。</p>
        <p>強調したい部分には&lt;strong&gt;や&lt;em&gt;を使うこともできます。</p>
      </div>
    </article>

    <!-- 記事２ -->
    <article class="post">
      <h2 class="post-title">記事タイトル２</h2>
      <div class="post-meta">投稿日: 2026-10-12 ｜ カテゴリ: 技術メモ</div>
      <div class="post-content">
        <p>別の記事の本文サンプルです。コードや引用などもここに入れられます。</p>
      </div>
    </article>

  </main>
  <footer>
    &copy; 2026 ブログタイトル - All rights reserved.
  </footer>
  <script>
  fetch("header.html")
    .then(res => res.text())
    .then(html => {
      console.log(html)
      document.getElementById("header").innerHTML = html;
    })
    .catch(err => {
      document.getElementById("header").innerHTML = "読み込みエラー";
    });
  </script>
</body>
</html>
